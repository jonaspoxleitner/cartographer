# Directory scanned for .gpx files; resolved against the working directory,
# so the server is started from the repository root (same convention as the CLI).
cartographer.routes-dir=routes

# Two tracks cross when they pass within this many meters of each other.
cartographer.intersection-tolerance-meters=10.0

# How far outside a tile, in tile units of 4096, edges are still drawn. Without
# the buffer a line running along a tile edge is cut at the edge and the
# neighbouring tile shows a seam.
cartographer.tile-buffer-units=64

# Zoom levels pre-rendered on every rebuild and after every upload: every tile
# the graph's extent reaches, widened by the buffer. Each level above adds four
# times the tiles, and z=19..22 nearly duplicate z=18 on this data.
cartographer.tile-cache-min-zoom=0
cartographer.tile-cache-max-zoom=18

# How long a browser may reuse a tile without asking again. Tiles only change
# when the graph is rebuilt (startup or upload), and the map page appends a
# generation query parameter after an upload, so an hour is safe.
cartographer.tile-cache-max-age-seconds=3600

# Where the pre-rendered tiles are kept between restarts: an MBTiles (SQLite)
# file, rewritten on every rebuild. A start whose routes and tile settings are
# unchanged loads it and skips the pre-render; a stale or unreadable file is
# ignored and the tiles are rendered again.
cartographer.mbtiles-file=tiles.mbtiles
