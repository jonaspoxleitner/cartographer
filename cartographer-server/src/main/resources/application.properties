# Directory scanned for .gpx files; resolved against the working directory,
# so the server is started from the repository root (same convention as the CLI).
cartographer.routes-dir=routes

# Two tracks cross when they pass within this many meters of each other.
cartographer.intersection-tolerance-meters=10.0

# How far outside a tile, in tile units of 4096, edges are still drawn. Without
# the buffer a line running along a tile edge is cut at the edge and the
# neighbouring tile shows a seam.
cartographer.tile-buffer-units=64
