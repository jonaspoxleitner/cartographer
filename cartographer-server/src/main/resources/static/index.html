<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cartographer</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
        integrity="sha384-MinO0mNliZ3vwppuPOUnGa+iq619pfMhLVUXfC4LHwSCvF9H+6P/KO4Q7qBOYV5V" crossorigin="">
  <style>
    html, body, #map {
      height: 100%;
      margin: 0;
    }
    body {
      font-family: system-ui, sans-serif;
      font-size: 14px;
      color: #222;
    }
    #panel {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1000;
      width: 260px;
      padding: 12px 14px;
      border-radius: 6px;
      background: #fff;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.3);
    }
    #panel h1 {
      margin: 0 0 8px;
      font-size: 16px;
    }
    #status {
      margin: 0 0 10px;
      min-height: 1.2em;
    }
    #status.error {
      color: #c62828;
    }
    #status.ok {
      color: #2e7d32;
    }
    #legend {
      margin: 0 0 10px;
      padding: 0;
      list-style: none;
    }
    #legend li {
      margin: 2px 0;
    }
    .swatch {
      display: inline-block;
      width: 20px;
      margin-right: 6px;
      vertical-align: middle;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    button {
      cursor: pointer;
    }
    #baseline {
      margin: 10px 0 0;
      font-size: 12px;
    }
    #baseline a {
      color: #1565c0;
    }
  </style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h1>cartographer</h1>
  <p id="status">Loading tiles&hellip;</p>
  <ul id="legend">
    <li><span class="swatch" style="height:3px;background:#9e9e9e"></span>traversed once</li>
    <li><span class="swatch" style="height:5px;background:#f0a500"></span>shared or retraced twice</li>
    <li><span class="swatch" style="height:7px;background:#e65100"></span>three times or more</li>
    <li><span class="swatch" style="width:9px;height:9px;border-radius:50%;background:#1a1a1a"></span>junction</li>
  </ul>
  <form id="upload">
    <input type="file" id="file" accept=".gpx" required>
    <button type="submit">Upload route</button>
  </form>
  <p id="baseline"><a href="/baseline.html">GeoJSON baseline</a></p>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"
        integrity="sha384-SYKAG6cglRMN0RVvhNeBY0r3FYKNOJtznwA0v7B5Vp9tr31xAHsZC0DqkQ/pZDmj" crossorigin=""></script>
<script>
  'use strict';

  // Same palette and widths as baseline.html, so the two pages can be diffed
  // side by side: a single pass is thin and grey, shared or retraced stretches
  // get wider and warmer with every extra traversal.
  const EDGE_STYLE = [
    { color: '#9e9e9e', width: 3 },
    { color: '#f0a500', width: 5 },
    { color: '#e65100', width: 7 },
  ];

  const SOURCE_ID = 'graph';
  const EDGE_LAYER_ID = 'edges';
  const JUNCTION_LAYER_ID = 'junctions';
  const TILEJSON_URL = '/tiles/tilejson.json';

  const statusLine = document.getElementById('status');
  const uploadForm = document.getElementById('upload');
  const fileInput = document.getElementById('file');

  const map = new maplibregl.Map({
    container: 'map',
    style: {
      version: 8,
      sources: {
        osm: {
          type: 'raster',
          tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
          tileSize: 256,
          maxzoom: 19,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        },
      },
      layers: [{id: 'osm', type: 'raster', source: 'osm'}],
    },
    center: [0, 20],
    zoom: 2,
  });

  // Same top-left zoom buttons the Leaflet baseline shows.
  map.addControl(new maplibregl.NavigationControl(), 'top-left');

  // `min` clamps above at 3 before matching, mirroring baseline.html's
  // Math.min(Math.max(traversals, 1), EDGE_STYLES.length) - 1: 1 or less falls
  // through to the grey style, 2 is orange, 3 and above is dark orange.
  const edgeLayer = {
    id: EDGE_LAYER_ID,
    type: 'line',
    source: SOURCE_ID,
    'source-layer': 'edges',
    layout: {'line-cap': 'round', 'line-join': 'round'},
    paint: {
      'line-color': ['match', ['min', ['get', 'traversals'], 3],
        2, EDGE_STYLE[1].color, 3, EDGE_STYLE[2].color, EDGE_STYLE[0].color],
      'line-width': ['match', ['min', ['get', 'traversals'], 3],
        2, EDGE_STYLE[1].width, 3, EDGE_STYLE[2].width, EDGE_STYLE[0].width],
      'line-opacity': 0.9,
    },
  };

  // The tiles publish one point per junction, placed at the same coordinate the
  // edge paths end at, so a dot covers the meeting point of the lines.
  // Zoom-interpolated radius: a small dot when a junction is a few pixels and a
  // clearly clickable one at street level.
  const junctionLayer = {
    id: JUNCTION_LAYER_ID,
    type: 'circle',
    source: SOURCE_ID,
    'source-layer': 'junctions',
    paint: {
      'circle-radius': ['interpolate', ['linear'], ['zoom'], 12, 1.5, 15, 3, 18, 5],
      'circle-color': '#1a1a1a',
      'circle-stroke-color': '#ffffff',
      'circle-stroke-width': 1,
    },
  };

  // Uploads are accepted before the MapLibre style has finished loading, so
  // every rebuild of the tile source waits for this once. The style's own
  // readiness is enough: waiting for the separate "load" event would hold the
  // graph back until the basemap tiles answered, and it would never appear
  // while they are slow or unavailable.
  const styleReady = new Promise(resolve => {
    if (map.isStyleLoaded()) {
      resolve();
    } else {
      map.once('style.load', resolve);
    }
  });

  map.on('mousemove', EDGE_LAYER_ID, () => {
    map.getCanvas().style.cursor = 'pointer';
  });
  map.on('mouseleave', EDGE_LAYER_ID, () => {
    map.getCanvas().style.cursor = '';
  });
  map.on('click', EDGE_LAYER_ID, event => {
    const properties = event.features[0].properties;
    new maplibregl.Popup()
      .setLngLat(event.lngLat)
      .setHTML(edgePopup(properties))
      .addTo(map);
  });

  let tileGeneration = 0;

  function edgePopup(properties) {
    const traversals = Number(properties.traversals);
    const lengthMeters = Math.round(Number(properties.lengthMeters));
    const routeCount = Number(properties.routeCount);
    return '<strong>' + traversals + '&times; traversed</strong><br>'
      + lengthMeters + ' m<br>'
      + (routeCount === 1 ? 'one route' : routeCount + ' routes');
  }

  function setStatus(message, cssClass) {
    statusLine.textContent = message;
    statusLine.className = cssClass || '';
  }

  /**
   * TileJSON publishes root-relative tile templates like
   * {@code /tiles/{z}/{x}/{y}.mvt}, and MapLibre builds its tile requests from
   * the template unchanged: the origin has to be prepended here, because a
   * request for a relative URL fails. The generation adds a query parameter the
   * server ignores, so a browser cache cannot answer with the previous graph's
   * tiles after an upload.
   */
  function tileUrl(template, generation) {
    return window.location.origin + template + (template.includes('?') ? '&' : '?') + 'v=' + generation;
  }

  /** Replaces the tile source with the server's current graph and fits the map to its bounds. */
  async function refreshTiles() {
    await styleReady;
    const response = await fetch(TILEJSON_URL);
    if (!response.ok) {
      throw new Error('HTTP ' + response.status);
    }
    const tileJson = await response.json();
    const generation = ++tileGeneration;
    const tiles = tileJson.tiles.map(template => tileUrl(template, generation));

    // Removing the source and its layers drops everything MapLibre has cached
    // for it, which is what makes a re-added source request the new tiles.
    for (const layerId of [JUNCTION_LAYER_ID, EDGE_LAYER_ID]) {
      if (map.getLayer(layerId)) {
        map.removeLayer(layerId);
      }
    }
    if (map.getSource(SOURCE_ID)) {
      map.removeSource(SOURCE_ID);
    }
    map.addSource(SOURCE_ID, {
      type: 'vector',
      tiles: tiles,
      minzoom: tileJson.minzoom,
      maxzoom: tileJson.maxzoom,
    });
    // edges first, so the junction dots are drawn on top of the line ends
    map.addLayer(edgeLayer);
    map.addLayer(junctionLayer);

    if (tileJson.bounds) {
      // Instant, like the Leaflet baseline's fitBounds: the graph should be in
      // place as soon as the page appears, not slide in over the basemap.
      map.fitBounds([[tileJson.bounds[0], tileJson.bounds[1]], [tileJson.bounds[2], tileJson.bounds[3]]],
        {padding: 20, animate: false});
    }
  }

  refreshTiles()
    .then(() => setStatus('Vector tiles ready', 'ok'))
    .catch(error => setStatus('Could not load the tiles: ' + error.message, 'error'));

  uploadForm.addEventListener('submit', async event => {
    event.preventDefault();
    const file = fileInput.files[0];
    if (!file) {
      return;
    }
    setStatus('Uploading ' + file.name + '\u2026');

    const body = new FormData();
    body.append('file', file);
    try {
      const response = await fetch('/api/routes', {method: 'POST', body: body});
      if (response.status === 409) {
        setStatus(file.name + ' is already in the routes directory; rename the file and try again.', 'error');
        return;
      }
      if (response.status === 400) {
        setStatus(file.name + ' was rejected: it is not a valid .gpx file.', 'error');
        return;
      }
      if (!response.ok) {
        setStatus('Upload failed: HTTP ' + response.status, 'error');
        return;
      }
      const ack = await response.json();
      await refreshTiles();
      setStatus(ack.filename + ' stored, ' + ack.edges + ' edges', 'ok');
      fileInput.value = '';
    } catch (error) {
      setStatus('Upload failed: ' + error.message, 'error');
    }
  });
</script>
</body>
</html>
