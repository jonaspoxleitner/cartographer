# Publishes the server image to GitHub Container Registry on version tags.
#
#   git tag v1.2.3 && git push origin v1.2.3
#
# Nothing is published from main: an image only appears for a `v*` tag, plus a
# manual run through the Actions UI (`workflow_dispatch`), which pushes only the
# commit-sha tag. The repository's Workflow permissions must allow writes, since
# the run needs to push the package with its own GITHUB_TOKEN; the package is
# private until it is made public in its GitHub package settings.
#
# No PUID/PGID build args: the image is host-agnostic and takes the runtime ids
# from the environment (see docker-entrypoint.sh), so one build serves every host.
name: Docker publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v1.2.3 -> 1.2.3, 1.2, latest; every build also gets its commit sha.
      # latest=auto moves `latest` only for a non-prerelease semver tag, so
      # v1.2.3-rc1 publishes 1.2.3-rc1 and sha-... but leaves `latest` alone.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The build stage re-downloads Maven dependencies on every run; the
          # GitHub Actions cache keeps that layer between tags.
          cache-from: type=gha
          cache-to: type=gha,mode=max
